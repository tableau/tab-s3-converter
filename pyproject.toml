[project]
name = "tab-s3-converter"
version = "0.1.0"
description = "Migrate Tableau files from the legacy s3 connector to amazon-s3."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
